#status {
	position: absolute;
	inset: 0;
	background-color: #0E0719;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 18px;

	z-index: 10;

#load-logo {
	width: min(24vh, 160px);

}

#load-wordmark {
	font-family: 'Fraunces', Georgia, serif;
	font-style: italic;
	font-weight: 800;
	font-size: clamp(34px, 7vh, 52px);
	line-height: 1;
	color: #B6FF3C;
	letter-spacing: -.01em;
}

#load-bar {
	width: min(46vw, 320px);
	height: 8px;
	border-radius: 999px;
	background: #241640;
	overflow: hidden;
}

#load-fill {
	width: 0%;
	height: 100%;
	border-radius: 999px;
	background: #B6FF3C;
	box-shadow: 0 0 12px rgba(182, 255, 60, .7);
	transition: width .2s ease;
}

#load-bar.indeterminate #load-fill {
	width: 35%;
	animation: slide 1.2s ease-in-out infinite alternate;
}

@keyframes slide {
	from { margin-left: 0; }
	to { margin-left: 65%; }
}

@media (prefers-reduced-motion: reduce) {
	#load-bar.indeterminate #load-fill { animation: none; width: 100%; opacity: .5; }
}

#load-notice {
	display: none;
	max-width: 70vw;
	background-color: #241640;
	border: 1px solid #E935C1;
	border-radius: .5rem;
	color: #F5F0FF;
	line-height: 1.4;
	padding: 1rem;
	text-align: center;
}

#rotate-hint {
	position: fixed;
	inset: 0;
	z-index: 20;
	display: none;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 22px;
	background-color: #0E0719;
	text-align: center;
	padding: 24px;
}

#rotate-hint svg {
	width: 72px;
	height: 72px;
	animation: rotate-phone 2.2s ease-in-out infinite;
}

@keyframes rotate-phone {
	0%, 20% { transform: rotate(0deg); }
	55%, 80% { transform: rotate(90deg); }
	100% { transform: rotate(90deg); }
}

@media (prefers-reduced-motion: reduce) {
	#rotate-hint svg { animation: none; transform: rotate(90deg); }
}

#rotate-hint .rh-title {

@media (orientation: portrait) {

	#canvas { visibility: hidden; }

		<script>
const KikimoraViewport = (function () {
	const canvas = document.getElementById('canvas');
	const state = { w: 0, h: 0 };
	let settleTimer = null;
	let pendingTimer = null;
	let lockedUntil = 0;

	function measure() {
		const vv = window.visualViewport;
		return {
			w: Math.round(vv ? vv.width : window.innerWidth),
			h: Math.round(vv ? vv.height : window.innerHeight)
		};
	}

	function keyboardOpen() {
		const ae = document.activeElement;
		return !!ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA');
	}

	function apply(w, h) {
		if (w <= 0 || h <= 0) {
			return;
		}
		state.w = w;
		state.h = h;
		const scale = window.devicePixelRatio || 1;
		canvas.style.width = w + 'px';
		canvas.style.height = h + 'px';
		canvas.width = Math.floor(w * scale);
		canvas.height = Math.floor(h * scale);
	}

	function commit(m) {
		if (m.h > m.w) {
			return;
		}
		if (keyboardOpen()) {
			return;
		}
		if (m.w !== state.w || m.h !== state.h) {
			apply(m.w, m.h);
		}
	}

	function settle() {
		if (settleTimer) {
			clearInterval(settleTimer);
		}
		let last = null;
		let tries = 0;
		settleTimer = setInterval(function () {
			const m = measure();
			tries += 1;
			if ((last && m.w === last.w && m.h === last.h) || tries > 12) {
				clearInterval(settleTimer);
				settleTimer = null;
				commit(m);
			}
			last = m;
		}, 120);
	}

	function trigger() {
		const now = Date.now();
		if (now < lockedUntil) {
			if (!pendingTimer) {
				pendingTimer = setTimeout(function () {
					pendingTimer = null;
					trigger();
				}, lockedUntil - now + 20);
			}
			return;
		}
		lockedUntil = now + 1000;
		settle();
	}

	window.addEventListener('orientationchange', trigger);
	window.addEventListener('resize', trigger);
	if (window.visualViewport) {
		window.visualViewport.addEventListener('resize', trigger);
	}
	setInterval(function () {
		const m = measure();
		if (m.h <= m.w && !keyboardOpen() && !settleTimer
				&& (m.w !== state.w || m.h !== state.h)) {
			trigger();
		}
	}, 1000);

	const m0 = measure();
	if (m0.h > m0.w) {
		apply(m0.h, m0.w);
	} else {
		apply(m0.w, m0.h);
	}

	return state;
}());

window.kikimoraSafeArea = function () {
	const s = getComputedStyle(document.getElementById('sai'));
	return JSON.stringify({
		left:   parseFloat(s.paddingLeft)   || 0,
		top:    parseFloat(s.paddingTop)    || 0,
		right:  parseFloat(s.paddingRight)  || 0,
		bottom: parseFloat(s.paddingBottom) || 0,
		css_w:  KikimoraViewport.w || window.innerWidth,
		css_h:  KikimoraViewport.h || window.innerHeight
	});
};

window.kikimoraKeyboard = function () {
	const vv = window.visualViewport;
	const ae = document.activeElement;
	const focused = !!ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA');
	let kb = 0;
	if (vv && focused) {
		kb = Math.max(0, Math.round(KikimoraViewport.h - (vv.height + vv.offsetTop)));
	}
	return JSON.stringify({ kb: kb, css_h: KikimoraViewport.h });
};

const KIKIMORA_TURNSTILE_SITEKEY = '0x4AAAAAAEKGEniTMA6cuer8';

const KikimoraTurnstile = (function () {
	const WATCHDOG_MS = 7000;
	let ready = false;
	let widgetId = null;
	let busy = false;
	let current = null;
	let watchdog = null;
	const queue = [];

	function finishCurrent(token) {
		if (watchdog) { clearTimeout(watchdog); watchdog = null; }
		const f = current;
		current = null;
		busy = false;
		if (f) { f(typeof token === 'string' ? token : ''); }
		pump();
	}

	function pump() {
		if (!ready || busy || queue.length === 0) {
			return;
		}
		if (typeof turnstile === 'undefined') {
			while (queue.length) { queue.shift()(''); }
			return;
		}
		busy = true;
		current = queue.shift();
		watchdog = setTimeout(function () { finishCurrent(''); }, WATCHDOG_MS);
		try {
			if (widgetId === null) {
				widgetId = turnstile.render('#turnstile-slot', {
					sitekey: KIKIMORA_TURNSTILE_SITEKEY,
					execution: 'execute',
					callback: function (token) { finishCurrent(token); },
					'error-callback': function () { finishCurrent(''); return true; },
					'unsupported-callback': function () { finishCurrent(''); }
				});
			} else {
				turnstile.reset(widgetId);
			}
			turnstile.execute('#turnstile-slot');
		} catch (err) {
			console.warn('Turnstile execute fehlgeschlagen:', err);
			finishCurrent('');
		}
	}

	function markReady() {
		if (ready) { return; }
		ready = true;
		pump();
	}

	// Reihenfolgeunabhaengig: der ?onload=-Hook von api.js ist nur EINE Quelle
	// fuer "bereit". Zusaetzlich pollen wir selbst, ob window.turnstile schon
	// da ist — egal ob api.js vor oder nach diesem Inline-Block ausgefuehrt
	// wurde, ob es aus dem SW-Cache sofort kommt oder der onload-Parameter mal
	// verloren geht. window.kikimoraTurnstile ist davon unabhaengig ab
	// HTML-Parse definiert (synchrones Inline-<script> vor dem api.js-Tag);
	// frueh eintreffende Aufrufe warten in der queue und werden von pump()
	// nach markReady() abgearbeitet.
	(function poll(tries) {
		if (ready) { return; }
		if (typeof turnstile !== 'undefined') {
			if (typeof turnstile.ready === 'function') { turnstile.ready(markReady); }
			else { markReady(); }
			return;
		}
		if (tries <= 0) { return; }
		setTimeout(function () { poll(tries - 1); }, 100);
	}(100));

	return {
		onload: markReady,
		request: function (done) {
			return new Promise(function (resolve) {
				queue.push(function (token) {
					try { if (typeof done === 'function') { done(token); } }
					catch (err) { console.warn('Turnstile-Callback warf:', err); }
					resolve(token);
				});
				pump();
			});
		}
	};
}());

window.kikimoraTurnstileOnload = KikimoraTurnstile.onload;
window.kikimoraTurnstile = KikimoraTurnstile.request;

const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":10312388,"index.wasm":37685705},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};

GODOT_CONFIG['canvasResizePolicy'] = 0;
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

try {
	if (screen.orientation && screen.orientation.lock) {
		screen.orientation.lock('landscape').catch(() => {});
	}
} catch (err) {}

(function () {
	const statusOverlay = document.getElementById('status');
	const loadBar = document.getElementById('load-bar');
	const loadFill = document.getElementById('load-fill');
	const statusNotice = document.getElementById('load-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		loadBar.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		text.split('\n').forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('Unbekannter Fehler beim Laden.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		const missingMsg = 'Dein Browser kann Kikimora leider nicht ausführen. Es fehlt:\n';
		displayFailureNotice(missingMsg + missing.join('\n'));
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					loadBar.classList.remove('indeterminate');
					loadFill.style.width = ((current / total) * 100).toFixed(1) + '%';
				} else {
					loadBar.classList.add('indeterminate');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}

	if ('serviceWorker' in navigator) {
		window.addEventListener('load', () => {
			navigator.serviceWorker.register('sw.js').catch((err) => {
				console.warn('Service-Worker-Registrierung fehlgeschlagen:', err);
			});
		});
	}
}());
