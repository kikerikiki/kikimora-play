<!DOCTYPE html>
<html lang="de">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<meta name="theme-color" content="#0E0719">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<meta name="apple-mobile-web-app-title" content="Kikimora">
		<title>Kikimora</title>
		<link rel="manifest" href="manifest.json">
		<link rel="icon" type="image/png" href="icons/icon-192.png">
		<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
		<style>
@font-face {
	font-family: 'Fraunces';
	src: url('fonts/fraunces-italic-var.woff2') format('woff2');
	font-style: italic;
	font-weight: 100 900;
	font-display: swap;
}
@font-face {
	font-family: 'Inter';
	src: url('fonts/inter-var.woff2') format('woff2');
	font-weight: 100 900;
	font-display: swap;
}

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: #F5F0FF;
	background-color: #0E0719;
	overflow: hidden;
	touch-action: none;
	font-family: 'Inter', system-ui, sans-serif;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

/* ── Ladebildschirm im Kikimora-CI ──────────────────────────────── */
#status {
	position: absolute;
	inset: 0;
	background-color: #0E0719;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 18px;
	visibility: hidden;
	z-index: 10;
}

#load-logo {
	width: min(24vh, 160px);
	height: auto;
	filter: drop-shadow(0 8px 30px rgba(138, 43, 226, .5));
}

#load-wordmark {
	font-family: 'Fraunces', Georgia, serif;
	font-style: italic;
	font-weight: 800;
	font-size: clamp(34px, 7vh, 52px);
	line-height: 1;
	color: #B6FF3C;
	letter-spacing: -.01em;
}

#load-bar {
	width: min(46vw, 320px);
	height: 8px;
	border-radius: 999px;
	background: #241640;
	overflow: hidden;
}

#load-fill {
	width: 0%;
	height: 100%;
	border-radius: 999px;
	background: #B6FF3C;
	box-shadow: 0 0 12px rgba(182, 255, 60, .7);
	transition: width .2s ease;
}

#load-bar.indeterminate #load-fill {
	width: 35%;
	animation: slide 1.2s ease-in-out infinite alternate;
}

@keyframes slide {
	from { margin-left: 0; }
	to { margin-left: 65%; }
}

@media (prefers-reduced-motion: reduce) {
	#load-bar.indeterminate #load-fill { animation: none; width: 100%; opacity: .5; }
}

#load-notice {
	display: none;
	max-width: 70vw;
	background-color: #241640;
	border: 1px solid #E935C1;
	border-radius: .5rem;
	color: #F5F0FF;
	line-height: 1.4;
	padding: 1rem;
	text-align: center;
}

/* ── Querformat-Hinweis (iOS-Fallback, liegt ueber allem — auch beim Laden) ── */
#rotate-hint {
	position: fixed;
	inset: 0;
	z-index: 20;
	display: none;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 22px;
	background-color: #0E0719;
	text-align: center;
	padding: 24px;
}

#rotate-hint svg {
	width: 72px;
	height: 72px;
	animation: rotate-phone 2.2s ease-in-out infinite;
}

@keyframes rotate-phone {
	0%, 20% { transform: rotate(0deg); }
	55%, 80% { transform: rotate(90deg); }
	100% { transform: rotate(90deg); }
}

@media (prefers-reduced-motion: reduce) {
	#rotate-hint svg { animation: none; transform: rotate(90deg); }
}

#rotate-hint .rh-title {
	font-family: 'Fraunces', Georgia, serif;
	font-style: italic;
	font-weight: 800;
	font-size: clamp(26px, 7vw, 36px);
	color: #B6FF3C;
	line-height: 1.15;
}

#rotate-hint .rh-sub {
	font-size: 16px;
	color: #F5F0FF;
}

#rotate-hint .rh-lock {
	font-size: 13px;
	color: #6B5C8C;
	max-width: 300px;
	line-height: 1.4;
}

@media (orientation: portrait) {
	#rotate-hint { display: flex; }
	#canvas { visibility: hidden; }
}

/* ── Godots Virtual-Keyboard-Overlay ────────────────────────────────────
   Bei aktivem html/experimental_virtual_keyboard legt Godot ein <input>
   und ein <textarea> direkt vor das Canvas (body-Kinder, volle Canvas-
   Fläche), damit Mobile-Browser überhaupt eine Tastatur öffnen. Die
   Elemente dürfen NICHT display:none bekommen (dann keine Tastatur mehr),
   aber nichts von ihnen darf sichtbar werden: Godot zeichnet Caret und
   Text selbst — der Browser-Caret des Overlays wäre der „zweite Cursor
   an falscher Stelle". 16px font-size verhindert Safaris Auto-Zoom beim
   Fokussieren (zoomt bei Inputs < 16px). */
body > input, body > textarea {
	caret-color: transparent !important;
	color: transparent !important;
	background: transparent !important;
	border: 0 !important;
	outline: none !important;
	box-shadow: none !important;
	font-size: 16px !important;
	resize: none !important;
}
body > input::selection, body > textarea::selection {
	background: transparent !important;
	color: transparent !important;
}
		</style>
		
	</head>
	<body>
		<canvas id="canvas">
			Dein Browser unterstützt kein Canvas.
		</canvas>

		<noscript>
			Kikimora braucht JavaScript.
		</noscript>

		<div id="status">
			<img id="load-logo" src="kikolo.png" alt="">
			<div id="load-wordmark">Kikimora</div>
			<div id="load-bar" class="indeterminate"><div id="load-fill"></div></div>
			<div id="load-notice"></div>
		</div>

		<!-- Unsichtbarer Messpunkt für die Safe-Area: env(safe-area-inset-*) ist
		     nur via CSS lesbar (braucht viewport-fit=cover im viewport-Meta!),
		     LayoutManager holt die Werte über window.kikimoraSafeArea ab. -->
		<div id="sai" style="position:fixed;top:0;left:0;visibility:hidden;
			pointer-events:none;
			padding:env(safe-area-inset-top) env(safe-area-inset-right)
					env(safe-area-inset-bottom) env(safe-area-inset-left)"></div>

		<div id="rotate-hint" aria-hidden="true">
			<svg viewBox="0 0 24 24" fill="none" stroke="#B6FF3C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
				<rect x="7.5" y="2.5" width="9" height="19" rx="2"/>
				<line x1="10.5" y1="18.5" x2="13.5" y2="18.5"/>
			</svg>
			<div>
				<div class="rh-title">dreh dein handy</div>
				<div class="rh-sub">kikimora spielt im querformat</div>
			</div>
			<div class="rh-lock">falls sich nichts dreht, schalt die rotationssperre aus</div>
		</div>

		<script>
// ── Viewport-Governor ───────────────────────────────────────────────────
// Die Engine läuft mit canvasResizePolicy=0 (Override unten): sie fasst die
// Canvas-Größe nie selbst an, sondern übernimmt jede Änderung, die wir hier
// setzen. Grund: iOS Safari — besonders als installierte Homescreen-App —
// meldet nach orientationchange teils dauerhaft veraltete oder halbfertige
// window.innerWidth/innerHeight-Werte. Mit Policy 2 (Engine liest jeden
// Frame innerWidth) fror das Spiel dann im kaputten Zwischenlayout fest;
// visualViewport ist auf iOS die verlässliche Quelle.
//
// Regeln:
//  - Hochformat wird NIE angewendet: der #rotate-hint liegt drüber, das
//    Canvas behält die letzte gültige Landscape-Größe → es gibt kein
//    kaputtes Zwischenlayout, aus dem zurückgerechnet werden müsste.
//  - Offene Bildschirmtastatur (Fokus im VK-Overlay) friert die Größe ein —
//    das Schrumpfen des visualViewport darf das Spiel-Layout nicht stauchen;
//    die Szenen rücken selbst nach (kikimoraKeyboard unten).
//  - Committet wird erst, wenn zwei Messungen im Abstand von 120 ms
//    dieselben Maße liefern (Nachfassen wie bei der Safe-Area-Brücke).
//  - Entprellung: nach einem Commit ist 1 s gesperrt. Wechsel in der Sperre
//    werden nur vorgemerkt und EINMAL am Sperr-Ende angewendet — und zwar
//    der dann tatsächliche Zustand, nie der erste der Sequenz.
//  - Watchdog (1 s): vergleicht Ist vs. Soll — selbst ein Wechsel ganz ohne
//    Event kann nicht dauerhaft verschluckt werden.
const KikimoraViewport = (function () {
	const canvas = document.getElementById('canvas');
	const state = { w: 0, h: 0 };          // zuletzt angewendete CSS-Maße
	let settleTimer = null;
	let pendingTimer = null;
	let lockedUntil = 0;

	function measure() {
		const vv = window.visualViewport;
		return {
			w: Math.round(vv ? vv.width : window.innerWidth),
			h: Math.round(vv ? vv.height : window.innerHeight)
		};
	}

	function keyboardOpen() {
		const ae = document.activeElement;
		return !!ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA');
	}

	function apply(w, h) {
		if (w <= 0 || h <= 0) {
			return;
		}
		state.w = w;
		state.h = h;
		const scale = window.devicePixelRatio || 1;
		canvas.style.width = w + 'px';
		canvas.style.height = h + 'px';
		canvas.width = Math.floor(w * scale);
		canvas.height = Math.floor(h * scale);
	}

	function commit(m) {
		if (m.h > m.w) {
			return;                        // Hochformat: einfrieren
		}
		if (keyboardOpen()) {
			return;                        // Tastatur offen: einfrieren
		}
		if (m.w !== state.w || m.h !== state.h) {
			apply(m.w, m.h);
		}
	}

	// Nachfassen: alle 120 ms messen, bis zwei aufeinanderfolgende Messungen
	// übereinstimmen (max. ~1,5 s, dann gilt die letzte).
	function settle() {
		if (settleTimer) {
			clearInterval(settleTimer);
		}
		let last = null;
		let tries = 0;
		settleTimer = setInterval(function () {
			const m = measure();
			tries += 1;
			if ((last && m.w === last.w && m.h === last.h) || tries > 12) {
				clearInterval(settleTimer);
				settleTimer = null;
				commit(m);
			}
			last = m;
		}, 120);
	}

	function trigger() {
		const now = Date.now();
		if (now < lockedUntil) {
			if (!pendingTimer) {
				pendingTimer = setTimeout(function () {
					pendingTimer = null;
					trigger();
				}, lockedUntil - now + 20);
			}
			return;
		}
		lockedUntil = now + 1000;
		settle();
	}

	window.addEventListener('orientationchange', trigger);
	window.addEventListener('resize', trigger);
	if (window.visualViewport) {
		window.visualViewport.addEventListener('resize', trigger);
	}
	setInterval(function () {
		const m = measure();
		if (m.h <= m.w && !keyboardOpen() && !settleTimer
				&& (m.w !== state.w || m.h !== state.h)) {
			trigger();
		}
	}, 1000);

	// Startgröße: im Hochformat gebootet → Landscape-Maße raten (Achsen
	// getauscht); die erste echte Landscape-Messung korrigiert via settle().
	const m0 = measure();
	if (m0.h > m0.w) {
		apply(m0.h, m0.w);
	} else {
		apply(m0.w, m0.h);
	}

	return state;
}());

// Safe-Area-Insets für autoloads/layout_manager.gd (JavaScriptBridge).
// Liefert CSS-Pixel + die zugehörige Referenzgröße, damit GDScript in den
// Viewport-Pixelraum umrechnen kann. Referenz ist die vom Governor
// angewendete Canvas-Größe (nicht innerWidth — die lügt auf iOS nach dem
// Drehen), damit die Umrechnung immer zum tatsächlichen Canvas passt.
window.kikimoraSafeArea = function () {
	const s = getComputedStyle(document.getElementById('sai'));
	return JSON.stringify({
		left:   parseFloat(s.paddingLeft)   || 0,
		top:    parseFloat(s.paddingTop)    || 0,
		right:  parseFloat(s.paddingRight)  || 0,
		bottom: parseFloat(s.paddingBottom) || 0,
		css_w:  KikimoraViewport.w || window.innerWidth,
		css_h:  KikimoraViewport.h || window.innerHeight
	});
};

// Tastaturhöhe in CSS-Pixeln relativ zur (eingefrorenen) Canvas-Höhe.
// DisplayServer.virtual_keyboard_get_height() liefert im Web-Export IMMER 0
// (es gibt keine vk_height-Bridge im Engine-JS) — die Szenen holen die Höhe
// stattdessen über KeyboardHelper.height_vp() von hier. Was unten von der
// Canvas-Höhe fehlt, verdeckt die Tastatur; offsetTop rausrechnen, weil iOS
// die Seite beim Fokussieren hochschieben kann.
window.kikimoraKeyboard = function () {
	const vv = window.visualViewport;
	const ae = document.activeElement;
	const focused = !!ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA');
	let kb = 0;
	if (vv && focused) {
		kb = Math.max(0, Math.round(KikimoraViewport.h - (vv.height + vv.offsetTop)));
	}
	return JSON.stringify({ kb: kb, css_h: KikimoraViewport.h });
};
		</script>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":10307220,"index.wasm":37685705},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
// Canvas-Größe steuert der Viewport-Governor oben — die Engine darf sie
// nicht selbst aus window.innerWidth/innerHeight ableiten (iOS meldet nach
// dem Drehen veraltete Werte). Policy 0 = Engine folgt der Canvas-Größe.
GODOT_CONFIG['canvasResizePolicy'] = 0;
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

// Querformat festnageln, wo der Browser es erlaubt (Android-Chrome in der
// installierten PWA). iOS Safari wirft hier — erwartet, der CSS-Overlay
// (#rotate-hint) ist dort der Fallback.
try {
	if (screen.orientation && screen.orientation.lock) {
		screen.orientation.lock('landscape').catch(() => {});
	}
} catch (err) { /* nicht unterstützt — Overlay übernimmt */ }

(function () {
	const statusOverlay = document.getElementById('status');
	const loadBar = document.getElementById('load-bar');
	const loadFill = document.getElementById('load-fill');
	const statusNotice = document.getElementById('load-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		loadBar.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		text.split('\n').forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('Unbekannter Fehler beim Laden.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		const missingMsg = 'Dein Browser kann Kikimora leider nicht ausführen. Es fehlt:\n';
		displayFailureNotice(missingMsg + missing.join('\n'));
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					loadBar.classList.remove('indeterminate');
					loadFill.style.width = ((current / total) * 100).toFixed(1) + '%';
				} else {
					loadBar.classList.add('indeterminate');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}

	// Service Worker erst nach dem Start registrieren, damit er dem ersten
	// Ladevorgang keine Bandbreite klaut. Cached danach alles für Offline-Start.
	if ('serviceWorker' in navigator) {
		window.addEventListener('load', () => {
			navigator.serviceWorker.register('sw.js').catch((err) => {
				console.warn('Service-Worker-Registrierung fehlgeschlagen:', err);
			});
		});
	}
}());
		</script>
	</body>
</html>
